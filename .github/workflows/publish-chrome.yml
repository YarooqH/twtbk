name: Publish to Chrome Web Store

# Push a tag that matches manifest.json's version (e.g. v1.0.1) to build,
# submit the new version for review and attach the zip to a GitHub release.
# Run it by hand to retry a failed upload for the current manifest version.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish_type:
        description: Publish as soon as review passes, or stage it to publish from the dashboard
        type: choice
        options: [DEFAULT_PUBLISH, STAGED_PUBLISH]
        default: DEFAULT_PUBLISH

permissions:
  contents: write

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Check the tag matches manifest.json
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # manifest.json has to sit at the root of the zip, so zip dist's contents
      - name: Package
        run: cd dist && zip -qr "../xmarks-v${{ steps.version.outputs.version }}.zip" .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmarks-v${{ steps.version.outputs.version }}
          path: xmarks-v${{ steps.version.outputs.version }}.zip

      - name: Upload and submit for review
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: hhdfgcjebkpakbcjaiikoceimfeogpih
          CWS_PUBLISH_TYPE: ${{ inputs.publish_type }}
        run: node scripts/publish-cws.mjs "xmarks-v${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "xmarks-v${{ steps.version.outputs.version }}.zip" --title "$GITHUB_REF_NAME" --generate-notes
